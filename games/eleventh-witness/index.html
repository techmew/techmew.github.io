<style>
:root{color-scheme:dark;--ink:#eae7df;--muted:#bbb9b3;--paper:#f6e7c9;--line:#d9c59f55;--type-scale:1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#090d13;color:var(--ink)}
body,button{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Hiragino Kaku Gothic ProN",Georgia,serif}
button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid #fff1b5;outline-offset:4px}
button:disabled{cursor:default;opacity:.5}
[hidden]{display:none!important}
#app{width:100%;height:100dvh;min-height:420px;position:relative;display:flex;flex-direction:column;overflow:hidden}
#scene{flex:1;min-height:0;position:relative;overflow:hidden;background:#19212b;isolation:isolate;touch-action:none}
#world{position:absolute;inset:-16%;background:#1d2a35 url("assets/reboot-snow.svg") center/cover no-repeat;transform:translate3d(var(--pan-x,0px),var(--pan-y,0px),0) scale(1.03);will-change:transform;transition:background-image .25s ease,transform .15s ease;z-index:-3}
#scene::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,#01060a85 0%,transparent 30%,#01050c11 49%,#03060bb3 88%,#020407e0 100%)}
#scene::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.23;background-image:radial-gradient(#e2e9e6 0.8px,transparent 1px),radial-gradient(#b8d1e1 0.7px,transparent 1px);background-size:130px 135px,186px 184px;background-position:13px 10px,94px 55px;animation:snowfall 19s linear infinite}
@keyframes snowfall{to{background-position:103px 260px,130px 265px}}
#scene[data-place="lobby"]::after,#scene[data-place="room"]::after,#scene[data-place="dining"]::after,#scene[data-place="hall"]::after,#scene[data-place="dryroom"]::after{opacity:.05}
#scene.fadeScene #world{animation:fadeWorld .42s ease}
@keyframes fadeWorld{0%{filter:brightness(.54)}100%{filter:brightness(1)}}
#top{position:absolute;z-index:8;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(13px + env(safe-area-inset-top,0px)) 19px 13px;background:linear-gradient(#050913cc,#05091311);pointer-events:none}
#top>*{pointer-events:auto}
#location{color:#f4e9d4;font-size:12px;letter-spacing:.14em;text-shadow:0 1px 7px #000;display:flex;align-items:center;gap:9px}
#location::before{content:"";width:18px;height:1px;background:#d9c7a2}
#topActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{background:#101821a8;border:1px solid #b3b3ac55;color:#ece8dd;border-radius:4px;font-family:"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:12px;padding:9px 11px;min-height:39px}
.iconbtn:hover,.iconbtn.active{background:#69583bce;border-color:#dac49a}
#centerView{position:absolute;top:calc(67px + env(safe-area-inset-top,0px));right:20px;z-index:2;background:#0c1016aa;border:1px solid #ffffff30;border-radius:50%;width:37px;height:37px;color:#f7e6c8}
#dialog{position:absolute;z-index:5;bottom:24px;left:max(22px,calc((100vw - 1180px)/2));right:max(22px,calc((100vw - 1180px)/2));min-height:190px;background:linear-gradient(95deg,rgba(8,10,16,.92),rgba(15,19,25,.87));box-shadow:0 19px 50px #0009,0 0 0 1px #eee5c125;backdrop-filter:blur(7px);padding:25px 36px 35px;border-top:1px solid #debe8255;border-bottom:1px solid #d9c4a233;pointer-events:none}
#who{font-size:15px;font-weight:700;color:#ecd4a3;letter-spacing:.13em;margin-bottom:13px}
#prose{color:#f5f0e6;font-size:calc(20px * var(--type-scale));line-height:1.95;letter-spacing:.032em;white-space:pre-line;overflow-wrap:anywhere;max-height:calc(49vh - 36px);overflow:auto;text-shadow:0 1px 5px #000;min-height:1.7em}
#dialog:not(.speech) #prose{font-weight:500}
#fullText{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
#dialog:after{content:"◆";position:absolute;right:32px;bottom:12px;color:#cfaf78;opacity:.9;animation:pulse 1.3s ease infinite}
@keyframes pulse{50%{opacity:.2;transform:translateY(2px)}}
#prompt{touch-action:pan-y;position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(840px,calc(100% - 32px));max-height:78%;overflow:auto;background:linear-gradient(#0b111ded,#0c121ced);border:1px solid #e0caa27f;box-shadow:0 20px 60px #000e;padding:clamp(19px,3.2vw,35px);backdrop-filter:blur(10px)}
#prompt h2{font-size:clamp(17px,2.6vw,24px);font-weight:500;line-height:1.7;color:#f0e3c7;letter-spacing:.08em;margin:0 0 20px}
#prompt:before{content:"その夜、あなたは";display:block;font-size:12px;letter-spacing:.3em;color:#b6a488;margin-bottom:9px}
#choices{display:flex;flex-direction:column;gap:11px}
.option{width:100%;min-height:64px;display:flex;align-items:center;gap:18px;justify-content:space-between;text-align:left;padding:14px 19px;border:1px solid #aaa79855;background:#28323ec2;color:#f4ecdf;transition:background .16s ease,border-color .16s ease;font-size:16px}
.option:hover,.option:focus-visible{border-color:#eacda1;background:#443c38}
.option .num{font:12px "Hiragino Kaku Gothic ProN",sans-serif;color:#cfb991}
.option .optionbody{flex:1;line-height:1.6}
.option strong{font-weight:500}
.option small{display:block;color:#b5b7bb;font-size:12px;margin-top:4px}
.option.major{justify-content:center;background:#50432e;border-color:#c9b087}
.endingNote{line-height:1.9;font-size:18px;text-align:center;margin:5px 0 22px}
#bottom{height:auto;flex:none;min-height:53px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px max(14px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:#101317;border-top:1px solid #5b5b5b44;z-index:9}
#bottom .controls{display:flex;gap:5px;align-items:center}
.barbtn{background:none;border:1px solid #aa9e8d33;padding:9px 11px;color:#cbc1ad;font:12px "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;white-space:nowrap}
.barbtn.active{color:#f4dda6;border-color:#d5b56f}
#hint{color:#adafae;font:11px "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;flex:1}
#counter{font-size:11px;letter-spacing:.13em;color:#d8c29e}
#saveBadge{display:none}
#cover{position:absolute;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;text-align:center;background:linear-gradient(90deg,#06101aca,#07101a24 42%,#08101ae3);padding:40px 20px}
.coverContent{padding:50px 30px;max-width:680px;width:100%;background:linear-gradient(#0d1017b5,#090d14b8);border-top:1px solid #ead4ac5e;border-bottom:1px solid #ead4ac5e;box-shadow:0 20px 70px #0008}
.eyebrow{letter-spacing:.35em;color:#e1bc88;font-size:12px;margin:0 0 21px}
#cover h1{font-weight:500;letter-spacing:.13em;line-height:1.4;font-size:clamp(31px,5.2vw,59px);margin:0 0 10px;text-shadow:0 4px 25px #000}
.cover-subl{font-size:clamp(15px,2vw,20px);font-weight:400;letter-spacing:.16em;color:#f3dec0;margin:0 0 30px}
.cover-desc{font-size:15px;line-height:2.2;color:#e9e8e6;margin:0 auto 31px}
.coverButtons{display:flex;flex-direction:column;align-items:center;gap:10px}
.coverBtn{background:#a58c64ec;color:#101318;border:1px solid #f4dfbb;border-radius:2px;font-weight:bold;padding:14px 25px;width:min(275px,100%);font-size:15px;letter-spacing:.14em}
.coverBtn.alt{background:#182333db;color:#e7dac3;border-color:#c5b08e}
.coverInfo{color:#b5b1a7;font-size:11px;margin:26px 0 0}
#modal{touch-action:pan-y;position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:#080b11dd;backdrop-filter:blur(7px)}
.modalShell{width:min(730px,100%);max-height:90%;padding:26px;background:#101721;border:1px solid #b6a27c99;box-shadow:0 20px 65px #000d;overflow:hidden;display:flex;flex-direction:column}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #cfb68555;padding-bottom:14px}
#modalTitle{font-size:21px;margin:0;color:#f4e3c1;font-weight:400}
#modalBody{margin-top:14px;overflow:auto;overscroll-behavior:contain;padding:0 3px;line-height:1.8}
.logRow{margin:0 0 14px;padding:11px 0;border-bottom:1px solid #e7e0d327;white-space:pre-wrap;line-height:1.8}
.logRow b{font-size:13px;color:#e0c18e}
.logRow p{margin:3px 0;font-size:15px}
.modal-btn{padding:9px 13px;margin:4px;border:1px solid #bca98080;background:#293442;color:#f0e7d6;font-size:13px}
.muted{font-size:13px;color:#aaaeb5}
.slotRow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #aaa4a43b;padding:12px 0;flex-wrap:wrap}
.slotRow div{flex:1;min-width:140px}
#closeModal{border:1px solid #bca98077;background:#293442;color:#f5e8d1;padding:8px 14px}
#scene[data-place="dryroom"] #world{filter:brightness(.54) saturate(.7)}
#scene[data-place="road"] #world{filter:brightness(.68)}
#scene[data-place="room"] #world{filter:brightness(.78)}
#scene[data-place="hall"] #world{filter:brightness(.63)}
@media(max-width:700px){
 #top{padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}

 .option small{font-size:11px}
 #bottom{min-height:49px;padding:5px max(7px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(7px,env(safe-area-inset-left,0px))}
 .barbtn{font-size:10px;padding:8px 7px}
 #hint{font-size:9px;flex:1}

}
@media(max-width:390px){

}
@media(max-height:550px) and (orientation:landscape){

 .option{min-height:44px;padding:7px 13px}
 #bottom{min-height:38px}
 .barbtn{padding:4px 8px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Existing artwork: optimized WebP portraits, gently faded into the lodge scenery. */
#portrait{position:absolute;right:clamp(-18px,3vw,46px);bottom:0;z-index:1;pointer-events:none;user-select:none;-webkit-user-drag:none;width:auto;max-width:54vw;height:min(80%,710px);object-fit:contain;object-position:right bottom;filter:drop-shadow(-10px 8px 26px #01030899);-webkit-mask-image:radial-gradient(ellipse 70% 71% at 50% 47%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 70% 71% at 50% 47%,#000 62%,transparent 100%);transition:opacity .2s ease}
#portrait[hidden]{display:none!important}
@media(max-width:700px){#portrait{right:-12%;height:72%;max-width:93vw;opacity:.8;object-position:right bottom}}

@media(prefers-reduced-motion:reduce){#portrait{transition:none}}

/* YAMI-KAWA REBOOT: deliberately graphic 2D cel look, not glossy realism */

<body>
<div id="app">
<main id="scene" role="main" aria-label="物語の画面">
<div id="world" aria-hidden="true"></div>
<img id="portrait" alt="" width="320" height="480" decoding="async" hidden aria-hidden="true">
<header id="top">
<div id="location">山麓のバス停</div>
<div id="topActions">
<button id="evidenceBtn" class="iconbtn" type="button">手がかり</button>
<button id="logBtn" class="iconbtn" type="button">履歴</button>
<button id="saveBtn" class="iconbtn" type="button">しおり</button>
<button id="menuBtn" class="iconbtn" type="button">設定</button>
</div>
</header>
<button id="centerView" aria-label="背景の視点を正面に戻す" title="正面へ戻す">◎</button>
<div id="dialog" hidden>
<div id="who"></div>
<div id="prose"></div>
<div id="fullText" aria-live="polite"></div>
</div>
<div id="prompt" hidden>
<h2>誰を信じる？</h2>
<div id="choices"></div>
</div>
<section id="cover" aria-label="タイトル画面">
<div class="coverContent">
<p class="eyebrow">YAMI × KAWAII × MURDER MYSTERY</p>
<h1>存在しない11人目</h1>
<p class="cover-subl">第一夜 ♥ 笑顔の死亡予告</p>
<p class="cover-desc">十人全員に届いた、犯人指名の招待状。<br>十一個のカップと、笑う少女。<br>今夜、誰かが死ぬ。――笑っているのは誰？</p>
<div class="coverButtons">
<button id="beginBtn" class="coverBtn">最初から読む</button>
<button id="continueBtn" class="coverBtn alt" hidden>続きから読む</button>
</div>
<p class="coverInfo">完全オリジナル・連載型サウンドノベル／第一夜 試作公開版</p>
</div>
</section>
<div id="modal" role="dialog" aria-modal="true" aria-label="ゲームの記録" hidden>
<div class="modalShell"><div class="modalHead"><h2 id="modalTitle">記録</h2><button id="closeModal">閉じる ×</button></div><div id="modalBody"></div></div>
</div>
</main>
<footer id="bottom">
<div id="counter">第一夜：到着</div>
<div id="hint">タップで進む　／　ドラッグで見回す</div>
<div class="controls">
<button class="barbtn" id="autoBtn">自動</button>
<button class="barbtn" id="skipBtn">既読</button>
<button class="barbtn" id="soundBtn">音 OFF</button>
</div>
<div id="saveBadge" aria-live="polite"></div>
</footer>
</div>
<script src="story.js"></script>
<script src="engine.js"></script>
</body>
</html>
