// Version 3.2: one pointer per stick, multiple pointers per action; tilt controls run speed.
const joy=$('joystick'),knob=$('joyKnob'),moveZone=$('moveZone');
let joyPointer=null,joyStartX=0,joyStartY=0,attackHeld=false;
const actionPointers=new Map();
function joyMove(e){
  if(e.pointerId!==joyPointer)return;
  const distance=clamp((e.clientX-joyStartX)/55,-1,1);
  joyX=Math.abs(distance)<.06?0:Math.sign(distance)*Math.pow(Math.abs(distance),1.12);
  knob.style.transform=`translate(calc(-50% + ${Math.round(distance*39)}px),-50%)`;
  joy.style.opacity=(Math.abs(distance)>.7?1:.83).toString();
}
function joyDown(e){
  if(joyPointer!==null||mode!=='playing')return;
  e.preventDefault();e.stopPropagation();
  joyPointer=e.pointerId;
  const box=joy.getBoundingClientRect();
  const centerX=box.left+box.width/2,centerY=box.top+box.height/2;
  // Touching the visible stick moves immediately; swipes elsewhere in the left zone are relative.
  const onStick=Math.hypot(e.clientX-centerX,e.clientY-centerY)<=box.width*.48;
  joyStartX=onStick?centerX:e.clientX;joyStartY=e.clientY;
  try{moveZone.setPointerCapture(e.pointerId)}catch(err){}
  joyMove(e);
}
moveZone.addEventListener('pointerdown',joyDown);
moveZone.addEventListener('pointermove',joyMove);
function joyStop(e){
  if(e.pointerId!==joyPointer)return;
  joyPointer=null;joyX=0;
  knob.style.transform='translate(-50%,-50%)';joy.style.opacity='.82';
  try{if(moveZone.hasPointerCapture(e.pointerId))moveZone.releasePointerCapture(e.pointerId)}catch(err){}
}
for(const ev of ['pointerup','pointercancel','lostpointercapture'])moveZone.addEventListener(ev,joyStop);
function setupAction(id,press,release){
  const b=$(id),active=new Set();actionPointers.set(id,active);
  b.addEventListener('pointerdown',e=>{
    if(mode!=='playing'||active.has(e.pointerId))return;
    e.preventDefault();e.stopPropagation();active.add(e.pointerId);
    try{b.setPointerCapture(e.pointerId)}catch(err){}
    b.classList.add('pressed');press();
  });
  const stop=e=>{
    if(!active.has(e.pointerId))return;
    active.delete(e.pointerId);
    if(active.size===0){b.classList.remove('pressed');release?.()}
    try{if(b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId)}catch(err){}
  };
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,stop);
}
setupAction('jump',()=>{jumpHeld=true;jumpBuffer=.15},()=>{jumpHeld=false});
setupAction('punch',()=>{punchQueue=true;attackHeld=true},()=>{attackHeld=false});
window.addEventListener('keydown',e=>{
  if(e.target?.closest?.('input,textarea,select,[contenteditable="true"]'))return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(keys.has(e.code))return;
  keys.add(e.code);
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){jumpHeld=true;jumpBuffer=.15}
  if(e.code==='KeyJ'||e.code==='KeyZ'){punchQueue=true;attackHeld=true}
  if(e.code==='KeyK'||e.code==='KeyX')dashQueue=true;
  if(e.code==='KeyM')toggleSound();
  if(e.code==='KeyR'&&(mode==='playing'||mode==='dying')){createLevel();mode='playing';toast('リトライ')}
  if(e.code==='Escape')showMenu()
});
window.addEventListener('keyup',e=>{
  keys.delete(e.code);
  if(['Space','ArrowUp','KeyW'].includes(e.code)&&!actionPointers.get('jump').size)jumpHeld=false;
  if(['KeyJ','KeyZ'].includes(e.code)&&!actionPointers.get('punch').size)attackHeld=false;
});
function resetInputs(){
  keys.clear();joyX=0;jumpHeld=false;attackHeld=false;dashQueue=false;punchQueue=false;jumpBuffer=0;
  const oldPointer=joyPointer;joyPointer=null;
  if(oldPointer!==null){try{if(moveZone.hasPointerCapture(oldPointer))moveZone.releasePointerCapture(oldPointer)}catch(err){}}
  knob.style.transform='translate(-50%,-50%)';joy.style.opacity='.82';
  for(const [id,active] of actionPointers){
    const b=$(id),ids=[...active];active.clear();b.classList.remove('pressed');
    for(const pid of ids){try{if(b.hasPointerCapture(pid))b.releasePointerCapture(pid)}catch(err){}}
  }
}
