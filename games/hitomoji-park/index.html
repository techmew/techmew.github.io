<body>
<div class="wrap">
<header><button class="brand" id="brand"><span class="logo">あ</span>ひともじ遊園</button><span class="meta">ちいさな、4つの遊び。</span><button class="sound" id="sound" aria-pressed="true">♪ 音 ON</button></header>
<main id="home">
<section class="hero"><div><div class="eyebrow">WORDS CAN PLAY</div><h1>文字って、<br>こんなに<em>遊べる。</em></h1><p>一文字で釣る。名前で走る。言葉で守る。漢字を積む。<br>考えるより、さわってみよう。</p><div class="subline">ダウンロード不要　·　スマホ対応　·　4つのゲーム</div></div><div class="hero-illust" aria-hidden="true"><span class="sun"></span><span class="a">山</span><span class="b">あ</span><span class="d">口</span><span class="land"></span></div></section>
<div class="section-head"><h2>どれで遊ぶ？</h2><span>01 — 04</span></div>
<div class="cards">
<button class="card" data-game="fish"><span class="art"><span>し</span></span><span class="cardcopy"><span class="number">01 / FISH</span><b>一文字つり ↗</b><small>その文字、魚が釣れる？</small></span></button>
<button class="card" data-game="dash"><span class="art"><span>ねこ</span></span><span class="cardcopy"><span class="number">02 / DASH</span><b>名前ダッシュ ↗</b><small>名前が走る。転ぶ。がんばる。</small></span></button>
<button class="card" data-game="roof"><span class="art"><span>やね</span></span><span class="cardcopy"><span class="number">03 / ROOF</span><b>ひとこと屋根 ↗</b><small>小さな誰かを、雨から守る。</small></span></button>
<button class="card" data-game="tower"><span class="art"><span>田</span></span><span class="cardcopy"><span class="number">04 / TOWER</span><b>漢字タワー ↗</b><small>たった一文字、されど一文字。</small></span></button>
</div><div class="foot">へんな形が、いい形。 ✳</div>
</main>
<main id="play" class="hidden">
<div class="topline"><button class="text-btn" id="back">← 4つの遊び</button><span id="best">自己ベスト —</span></div>
<div class="headrow"><div><div class="number" id="number"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="bigscore"><span id="scorelabel"></span><b id="score">0</b><small id="extra"></small></div></div>
<div class="panel">
<div class="frame"><canvas id="stage" width="420" height="560" tabindex="0" aria-label="ゲーム画面"></canvas><div class="hint" id="hint"></div><div class="overlay" id="overlay"><div class="overlay-inner"><div class="overlay-mark" id="mark">し</div><span class="overlay-kicker" id="eyebrow">READY?</span><h2 id="ovtitle"></h2><p id="ovdesc"></p><button class="primary" id="start">あそぶ →</button><div><button class="secondary hidden" id="share">結果をシェア ↗</button></div></div></div></div>
<div class="controls"><div class="editline"><label id="inputlabel" for="word"></label><input id="word" type="text" autocomplete="off" spellcheck="false" maxlength="8" inputmode="text"></div><div class="rightbuttons"><button id="action" class="action">スタート →</button><button id="pause" class="tiny" aria-label="一時停止">Ⅱ</button><button id="restart" class="tiny" aria-label="最初から">↻</button></div></div>
</div>
<div class="instructions"><b>HOW TO PLAY</b><p id="help"></p><div class="pills" id="pills"></div></div>
<nav class="mininav" aria-label="ゲーム切り替え"><button data-game="fish" aria-label="一文字つり">釣</button><button data-game="dash" aria-label="名前ダッシュ">走</button><button data-game="roof" aria-label="ひとこと屋根">守</button><button data-game="tower" aria-label="漢字タワー">積</button></nav>
</main>
</div><div id="toast" class="toast hidden"></div>
