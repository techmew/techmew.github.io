name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed public URLs
        id: urls
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote

          base = "https://techmew.github.io"
          urls = set()

          try:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  text=True
              ).splitlines()
          except Exception:
              changed = []

          for p in changed:
              if not p.endswith(".html"):
                  continue
              if p == "404.html":
                  continue
              if p == "index.html":
                  urls.add(base + "/")
              elif p.endswith("/index.html"):
                  urls.add(base + "/" + p[:-10])
              else:
                  urls.add(base + "/" + p)

          # On the first setup run, also submit pages marked as modified today.
          sm = Path("sitemap.xml")
          if sm.exists():
              try:
                  root = ET.parse(sm).getroot()
                  ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  today = subprocess.check_output(["date", "-u", "+%Y-%m-%d"], text=True).strip()
                  for node in root.findall("sm:url", ns):
                      loc = node.findtext("sm:loc", default="", namespaces=ns).strip()
                      lastmod = node.findtext("sm:lastmod", default="", namespaces=ns).strip()
                      if loc and lastmod.startswith(today):
                          urls.add(loc)
              except Exception as e:
                  print(f"sitemap parse warning: {e}")

          out = sorted(urls)
          Path("/tmp/indexnow_urls.txt").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out))
          PY

      - name: Notify IndexNow
        shell: bash
        run: |
          if [ ! -s /tmp/indexnow_urls.txt ]; then
            echo "No changed public URLs to notify."
            exit 0
          fi

          python3 - <<'PY' > /tmp/indexnow.json
          import json
          from pathlib import Path
          urls = [u for u in Path("/tmp/indexnow_urls.txt").read_text(encoding="utf-8").splitlines() if u]
          print(json.dumps({
              "host": "techmew.github.io",
              "key": "5c58cd1d38779d2bbb79980d64db66d6",
              "keyLocation": "https://techmew.github.io/5c58cd1d38779d2bbb79980d64db66d6.txt",
              "urlList": urls
          }, ensure_ascii=False))
          PY

          code=$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}"             -H "Content-Type: application/json; charset=utf-8"             --data-binary @/tmp/indexnow.json             https://api.indexnow.org/indexnow)

          cat /tmp/indexnow-response.txt || true
          echo "IndexNow HTTP status: $code"

          case "$code" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
