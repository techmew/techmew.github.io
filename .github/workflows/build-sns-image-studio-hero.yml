name: Build SNS Image Studio hero

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/hq/sns-image-studio-hero.svg'
      - '.github/workflows/build-sns-image-studio-hero.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render JPEG and update HTML references
        run: |
          rsvg-convert -w 1600 -h 900 assets/images/hq/sns-image-studio-hero.svg -o /tmp/sns-image-studio-hero.png
          convert /tmp/sns-image-studio-hero.png -strip -sampling-factor 4:2:0 -quality 91 assets/images/hq/sns-image-studio-hero.jpg
          find . -name '*.html' -type f -print0 | xargs -0 sed -i 's#sns-image-studio-hero\.svg#sns-image-studio-hero.jpg#g'
          file assets/images/hq/sns-image-studio-hero.jpg
      - name: Commit generated hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Render SNS Image Studio hero image"
          git push
