name: Verify OTODAMA live matchmaking
on:
  push:
    branches: [main]
    paths:
      - 'games/otodama/index.html'
      - '.github/workflows/verify-otodama-online.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live Worker health and random matchmaking via WebSockets
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://otodama-room.nekokichi005.workers.dev';
          const healthResponse = await fetch(origin+'/health', {signal:AbortSignal.timeout(15000)});
          if (!healthResponse.ok) throw new Error('Health HTTP '+healthResponse.status);
          const health = await healthResponse.json();
          if (health.ok !== true || health.randomMatch !== true) throw new Error('Unexpected health: '+JSON.stringify(health));
          console.log('LIVE HEALTH PASS', JSON.stringify(health));
          const page = await fetch('https://techmew.github.io/games/otodama/?online-check='+Date.now(), {signal:AbortSignal.timeout(15000)});
          if(!page.ok)throw new Error('Game page HTTP '+page.status);
          const gameHtml=await page.text();
          if(!gameHtml.includes("const DEFAULT_SERVER_URL='https://otodama-room.nekokichi005.workers.dev'"))
            throw new Error('Published game has no default online server URL');
          if(!gameHtml.includes('id="battleChallengerOptIn"')||!gameHtml.includes('function startChallengerHandoff()')||!gameHtml.includes('function restoreCpuAfterHandoff()'))
            throw new Error('Published arcade handoff controls are stale or missing');
          console.log('LIVE ARCADE HANDOFF UI DEPLOY PASS');
          console.log('LIVE GITHUB PAGES GAME CONFIG PASS');
          if (!globalThis.WebSocket) throw new Error('Node WebSocket missing');
          const matched = await new Promise((resolve,reject)=>{
            const sockets=[], codes=[null,null];
            let settled=false;
            const done=(error,result)=>{
              if (settled) return;
              settled=true;
              clearTimeout(timeout);
              for (const sock of sockets) try {sock.close()} catch {}
              error?reject(error):resolve(result);
            };
            const timeout=setTimeout(()=>done(new Error('Timed out waiting for paired WebSocket messages')),15000);
            for(let n=0;n<2;n++){
              const socket = new WebSocket(origin.replace(/^https:/,'wss:')+'/random');
              sockets.push(socket);
              socket.addEventListener('open',()=>socket.send(JSON.stringify({type:'search'})));
              socket.addEventListener('message',e=>{
                let message;
                try{ message=JSON.parse(e.data);}catch(error){done(error);return;}
                if(message.type==='error'){done(new Error('Matchmaker: '+message.message));return;}
                if(message.type==='matched'){
                  codes[n]=message.code;
                  if(codes.every(Boolean)) {
                    if(!/^[A-HJ-NP-Z2-9]{6}$/.test(codes[0]) || codes[0]!==codes[1]) done(new Error('Mismatched room codes'));
                    else done(null,codes[0]);
                  }
                }
              });
              socket.addEventListener('error',()=>done(new Error('WebSocket connection error')));
            }
          });
          console.log('LIVE TWO-CLIENT RANDOM MATCH PASS:',matched);
          const roomStarted=await new Promise((resolve,reject)=>{
            const sockets=[],started=[false,false];let finished=false;
            const done=(err)=>{
              if(finished)return;finished=true;clearTimeout(timer);
              for(const sock of sockets)try{sock.close()}catch{}
              err?reject(err):resolve(true);
            };
            const timer=setTimeout(()=>done(new Error('Room start timed out')),15000);
            for(let n=0;n<2;n++){
              const ws=new WebSocket(origin.replace(/^https:/,'wss:')+'/room/'+matched);
              sockets.push(ws);
              ws.addEventListener('open',()=>{
                ws.send(JSON.stringify({type:'join',creature:{
                  seed:10000+n,name:'接続試験'+(n+1),type:'音の生き物',element:'音',
                  parts:{},voice:{vol:45,pitch:55,res:40,rhythm:60,stable:65,breath:40}
                }}));
              });
              ws.addEventListener('message',e=>{
                let msg;try{msg=JSON.parse(e.data)}catch(error){done(error);return}
                if(msg.type==='error'){done(new Error('Room: '+msg.message));return}
                if(msg.type==='session')ws.send(JSON.stringify({type:'ready',autoOnly:true}));
                if(msg.type==='live_start'){started[n]=true;if(started.every(Boolean))done(null)}
              });
              ws.addEventListener('error',()=>done(new Error('Room socket error')));
            }
          });
          console.log('LIVE TWO-CLIENT ROOM START PASS:',matched,roomStarted);
          JS
