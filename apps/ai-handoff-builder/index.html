<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Handoff Builder｜AI引継ぎプロンプトメーカー | himaneko</title><meta name="description" content="止まったAI作業を別チャット・別モデルへ引き継ぐMarkdownをブラウザだけで作成。進捗、判断、失敗、次工程、制約を構造化してコピー・保存できます。"><link rel="canonical" href="https://techmew.github.io/apps/ai-handoff-builder/"><meta property="og:image" content="https://techmew.github.io/assets/images/hq/ai-handoff-builder-hero.png"><meta name="twitter:card" content="summary_large_image"><style>:root{--bg:#080b12;--panel:#111723;--line:#293247;--text:#f6f8ff;--muted:#9aa6bb;--a:#65e6ff;--b:#9d76ff;--good:#73e6ae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#241650 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.top{position:sticky;top:0;z-index:10;background:#080b12e8;border-bottom:1px solid #20283a;backdrop-filter:blur(12px)}.bar,.main{width:min(1180px,calc(100% - 28px));margin:auto}.bar{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-weight:900}.links{display:flex;gap:14px}.links a{color:#cbd5e8;text-decoration:none;font-size:.82rem}.intro{padding:34px 0 20px}.intro h1{font-size:clamp(2rem,6vw,4rem);line-height:1.02;margin:0 0 12px}.intro p{max-width:820px;color:var(--muted);line-height:1.8}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.9fr);gap:16px;padding-bottom:60px}.panel{background:#111723;border:1px solid var(--line);border-radius:16px;padding:17px}.panel h2{font-size:1rem;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px;margin:10px 0}.field.full{grid-column:1/-1}.field label{font-size:.76rem;color:#c5cee0;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid #354057;background:#090e17;color:#fff;border-radius:9px;padding:10px;font:inherit;font-size:.82rem}.field textarea{min-height:92px;resize:vertical}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:1px solid #46516b;background:#171e2c;color:#fff;border-radius:9px;padding:10px 13px;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#6557dc,#2f92c8);border-color:#7770f3}.btn.good{border-color:#397356;background:#173c2b}.btn.danger{border-color:#713f47;background:#351a20}.score{display:flex;align-items:center;gap:10px;border:1px solid #33405a;border-radius:12px;padding:10px 12px;margin-bottom:10px}.meter{height:8px;background:#252d3d;border-radius:99px;overflow:hidden;flex:1}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}.preview{width:100%;min-height:650px;resize:vertical;border:1px solid #354057;background:#070b12;color:#eaf0ff;border-radius:12px;padding:14px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.note{color:#9ca8bb;font-size:.75rem;line-height:1.65}.msg{min-height:1.3em;color:var(--good);font-size:.75rem;margin-top:8px}.warn{border-left:4px solid #ce9b48;background:#231d12;padding:10px 12px;border-radius:8px;color:#dfd0b6;font-size:.75rem;line-height:1.6}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{min-height:480px}}@media(max-width:620px){.grid{grid-template-columns:1fr}.links a:nth-child(n+2){display:none}}</style></head><body><header class="top"><div class="bar"><a class="brand" href="/">himaneko / AI Handoff Builder</a><nav class="links"><a href="/tools/ai-handoff-builder.html">使い方</a><a href="/blog/ai-handoff-prompt-guide.html">実用記事</a><a href="/tools/">無料ツール</a></nav></div></header><main class="main"><section class="intro"><h1>AI Handoff Builder</h1><p>止まった作業を、現在状態・判断・失敗・次工程・制約に分けて引き継ぐMarkdownを作ります。入力内容は自動送信しません。</p></section><div class="layout"><section class="panel"><h2>引継ぎ情報を入力</h2><div class="grid"><div class="field"><label for="preset">用途</label><select id="preset"><option>開発・コード</option><option>サイト運営</option><option>調査・研究</option><option>記事・制作</option><option>汎用</option></select></div><div class="field"><label for="project">プロジェクト名</label><input id="project"></div><div class="field full"><label for="request">元の依頼 *</label><textarea id="request"></textarea></div><div class="field full"><label for="goal">今回のゴール・範囲</label><textarea id="goal"></textarea></div><div class="field full"><label for="progress">現在の進捗・完了済み *</label><textarea id="progress"></textarea></div><div class="field full"><label for="files">関連ファイル・URL・リポジトリ</label><textarea id="files"></textarea></div><div class="field full"><label for="decisions">重要な判断と理由</label><textarea id="decisions"></textarea></div><div class="field full"><label for="failed">試したが失敗・不採用だったこと</label><textarea id="failed"></textarea></div><div class="field full"><label for="blockers">ブロッカー・未解決</label><textarea id="blockers"></textarea></div><div class="field full"><label for="next">次にやること *</label><textarea id="next"></textarea></div><div class="field full"><label for="environment">環境・コマンド・バージョン</label><textarea id="environment"></textarea></div><div class="field full"><label for="constraints">制約・変更禁止事項 *</label><textarea id="constraints"></textarea></div><div class="field full"><label for="done">完了条件・確認方法</label><textarea id="done"></textarea></div></div><div class="btns"><button class="btn primary" id="generate">引継ぎMarkdownを生成</button><button class="btn" id="sample">記入例</button><button class="btn good" id="saveDraft">この端末に下書き保存</button><button class="btn danger" id="clear">入力を消す</button></div><div id="msg" class="msg"></div><p class="note">下書き保存を押した場合だけlocalStorageへ保存します。共有端末では機密情報を保存しないでください。</p></section><section class="panel"><h2>出力</h2><div class="score"><strong id="scoreText">充足度 0%</strong><div class="meter"><span id="meter"></span></div></div><div class="warn">APIキー、パスワード、秘密鍵、個人情報などは入力しないでください。</div><textarea id="output" class="preview" readonly></textarea><div class="btns"><button class="btn primary" id="copy">コピー</button><button class="btn" id="download">Markdown保存</button></div></section></div></main><script>(function(){const ids=["project","request","goal","progress","files","decisions","failed","blockers","next","environment","constraints","done","preset"];const $=id=>document.getElementById(id),v=id=>$(id).value.trim();function sec(t,id){return v(id)?"## "+t+"\n"+v(id)+"\n\n":""}function score(){let n=["request","progress","next","constraints"].filter(x=>v(x)).length;["goal","files","decisions","done"].forEach(x=>{if(v(x))n+=.5});const p=Math.min(100,Math.round(n/6*100));$("scoreText").textContent="充足度 "+p+"%";$("meter").style.width=p+"%"}function build(){let o="# AI作業引継ぎ\n\n**プロジェクト:** "+(v("project")||"名称未設定")+"\n**用途:** "+$("preset").value+"\n**作成日:** "+new Date().toLocaleDateString("ja-JP")+"\n\n";[["元の依頼","request"],["今回のゴール・範囲","goal"],["現在の進捗・完了済み","progress"],["関連ファイル・URL・リポジトリ","files"],["重要な判断と理由","decisions"],["試したが失敗・不採用だったこと","failed"],["ブロッカー・未解決","blockers"],["次にやること","next"],["環境・コマンド・バージョン","environment"],["制約・変更禁止事項","constraints"],["完了条件・確認方法","done"]].forEach(x=>o+=sec(x[0],x[1]));o+="## 次のAIへの開始指示\n上の引継ぎを正本として読み、現在状態を確認してから「次にやること」の先頭から継続する。完了済みを作り直さず、未記載事項を推測で補完しない。矛盾がある場合は正本・現物・最新状態を確認する。\n";$("output").value=o;$("msg").textContent="生成しました。";score()}function save(){const d={};ids.forEach(id=>d[id]=$(id).value);localStorage.setItem("hnk-ai-handoff-draft",JSON.stringify(d));$("msg").textContent="この端末に下書きを保存しました。"}function load(){try{const d=JSON.parse(localStorage.getItem("hnk-ai-handoff-draft")||"null");if(d)ids.forEach(id=>{if(d[id]!=null)$(id).value=d[id]})}catch(e){}score()}function sample(){$("project").value="Webサイト更新";$("request").value="既存サイトへAI情報と実用ツールを追加して公開まで進める";$("goal").value="記事・ツール・内部導線・sitemapまで更新";$("progress").value="記事下書き完成。GitHub反映前。";$("files").value="repo: owner/example\nbranch: main";$("decisions").value="同じ検索意図の内容は1ページへ集約";$("failed").value="一覧だけ更新して本文を作らない方法は不採用";$("blockers").value="アイキャッチ反映が未完了";$("next").value="1. main確認\n2. 記事とツール追加\n3. 導線更新\n4. 公開確認";$("environment").value="GitHub Pages / main";$("constraints").value="完成機能を削除しない。未確認の数字を作らない。";$("done").value="対象URLが表示されること";build()}$("generate").onclick=build;$("saveDraft").onclick=save;$("sample").onclick=sample;$("clear").onclick=()=>{if(!confirm("入力と保存下書きを消しますか？"))return;ids.forEach(id=>{if(id!=="preset")$(id).value=""});localStorage.removeItem("hnk-ai-handoff-draft");$("output").value="";score()};$("copy").onclick=async()=>{if(!$("output").value)build();try{await navigator.clipboard.writeText($("output").value)}catch(e){$("output").select();document.execCommand("copy")}$("msg").textContent="コピーしました。"};$("download").onclick=()=>{if(!$("output").value)build();const b=new Blob([$("output").value],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(v("project")||"ai-handoff").replace(/[\\/:*?"<>|]/g,"-")+".md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};ids.forEach(id=>$(id).addEventListener("input",score));load()})();</script></body></html>
