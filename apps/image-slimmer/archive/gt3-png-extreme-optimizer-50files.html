<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT3 PNG 極限軽量化ツール 50枚対応</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111418;--panel:#1a1f25;--panel2:#222830;--line:#353e48;
  --text:#edf2f7;--muted:#9ca8b4;--accent:#4aa3ff;--good:#64d68a;--warn:#ffcc66;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
header p{margin:5px 0 0;color:var(--muted);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;margin:11px 0 6px;font-size:13px;color:#dbe4ed}
input,select,button{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
button{font-weight:700;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#071522}
button.good{background:var(--good);border-color:var(--good);color:#07170d}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:2px dashed #4b5663;border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.drag{border-color:var(--accent);background:#17283a}
.drop strong{color:var(--text)}
.drop input{display:none}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
.counter{margin-top:10px;font-size:13px}
.progress{height:8px;background:#0d1013;border-radius:99px;overflow:hidden;margin-top:12px;display:none}
.progress>div{height:100%;width:0;background:var(--accent)}

.viewer{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:#15191e;border:1px solid var(--line);border-radius:10px;padding:12px}
.panelHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:#29313a;color:#dce6ef}
.ok{color:var(--good)}
.warn{color:var(--warn)}
.preview{min-height:330px;display:grid;place-items:center;border-radius:8px;overflow:hidden;
background:
linear-gradient(45deg,#20252b 25%,transparent 25%),
linear-gradient(-45deg,#20252b 25%,transparent 25%),
linear-gradient(45deg,transparent 75%,#20252b 75%),
linear-gradient(-45deg,transparent 75%,#20252b 75%),#2b3138;
background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img{max-width:100%;max-height:430px}
.stats{margin-top:9px;font-size:13px;line-height:1.6;color:var(--muted)}

.thumbWrap{margin-top:16px}
.thumbTitle{font-size:13px;color:#dce5ed;margin-bottom:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:350px;overflow:auto}
.thumb{border:1px solid var(--line);border-radius:8px;padding:6px;background:#101419;cursor:pointer}
.thumb.active{outline:2px solid var(--accent)}
.thumb img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:5px;background:#252b32}
.thumb .name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.thumb .size{font-size:10px;color:var(--muted)}

.tableWrap{margin-top:16px;overflow:auto;max-height:320px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#181d23}
.smallBtn{width:auto;padding:5px 8px;font-size:11px}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .viewer{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>GT3 PNG 極限軽量化ツール</h1>
  <p>最大50枚。ドロップした元画像をそのまま表示し、アニメ素材は20KB狙いで一括軽量化。</p>
</header>

<main>
<section class="card">
  <h2>画像と設定</h2>

  <div id="drop" class="drop">
    <strong>最大50枚をまとめてドロップ</strong><br>
    またはクリックして選択
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple>
  </div>

  <div class="counter" id="counter">0 / 50 枚</div>

  <label>プリセット</label>
  <select id="preset">
    <option value="gt3anim" selected>GT3 アニメ素材：最大200×200 / 20KB狙い</option>
    <option value="gt3bg">GT3 背景：466×466 / 200KB狙い</option>
    <option value="custom">カスタム</option>
  </select>

  <div class="row">
    <div>
      <label>最大幅</label>
      <input id="maxW" type="number" min="16" max="4096" value="200">
    </div>
    <div>
      <label>最大高さ</label>
      <input id="maxH" type="number" min="16" max="4096" value="200">
    </div>
  </div>

  <label>目標容量（KB）</label>
  <input id="targetKB" type="number" min="5" max="5000" value="20">

  <div class="row">
    <div>
      <label>RGB色段階</label>
      <select id="minLevel">
        <option value="6">高画質</option>
        <option value="5">やや高画質</option>
        <option value="4" selected>標準</option>
        <option value="3">強圧縮</option>
        <option value="2">極圧縮</option>
      </select>
    </div>
    <div>
      <label>アルファ段階</label>
      <select id="alphaLevels">
        <option value="256">そのまま</option>
        <option value="16" selected>16段階</option>
        <option value="8">8段階</option>
        <option value="4">4段階</option>
        <option value="2">2段階</option>
      </select>
    </div>
  </div>

  <label><input id="allowShrink" type="checkbox" checked style="width:auto;margin-right:8px">20KBに収まらない場合は寸法も少しずつ縮小</label>
  <label><input id="cleanTransparent" type="checkbox" checked style="width:auto;margin-right:8px">透明画素のRGBを消して圧縮効率を上げる</label>

  <button id="opt" class="primary" style="margin-top:14px">選択した最大50枚を一括軽量化</button>
  <button id="downloadAll" class="good" style="margin-top:8px" disabled>処理済みPNGを全部保存</button>

  <div class="progress" id="prog"><div id="bar"></div></div>

  <div class="note">
    ※ ブラウザ内だけで処理。外部アップロードなし。<br>
    ※ 「全部保存」はブラウザの複数ダウンロード許可が必要な場合あり。<br>
    ※ 20KBを最優先するため、届かない画像は色数→寸法の順で圧縮。
  </div>
</section>

<section class="card">
  <div class="viewer">
    <div class="panel">
      <div class="panelHead"><b>元画像</b><span class="badge" id="srcBadge">未選択</span></div>
      <div class="preview"><img id="srcImg"></div>
      <div class="stats" id="srcStats">画像をドロップすると、ここに元画像が表示される。</div>
    </div>

    <div class="panel">
      <div class="panelHead"><b>軽量化後</b><span class="badge" id="outBadge">未処理</span></div>
      <div class="preview"><img id="outImg"></div>
      <div class="stats" id="outStats">処理後の画像がここに表示される。</div>
    </div>
  </div>

  <div class="thumbWrap">
    <div class="thumbTitle">読み込んだ画像（最大50枚）</div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr><th>#</th><th>ファイル</th><th>元</th><th>結果</th><th>寸法</th><th></th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</section>
</main>

<canvas id="work" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const MAX_FILES = 50;
let items = [];
let currentIndex = -1;

function fmtKB(n){ return (n/1024).toFixed(1)+" KB"; }

$("drop").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",e=>addFiles([...e.target.files]));

["dragenter","dragover"].forEach(t=>$("drop").addEventListener(t,e=>{
  e.preventDefault(); $("drop").classList.add("drag");
}));
["dragleave","drop"].forEach(t=>$("drop").addEventListener(t,e=>{
  e.preventDefault(); $("drop").classList.remove("drag");
}));
$("drop").addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));

function addFiles(files){
  const valid = files.filter(f=>/^image\/(png|jpeg|webp)$/.test(f.type));
  const remain = Math.max(0, MAX_FILES-items.length);
  valid.slice(0,remain).forEach(file=>{
    items.push({
      file,
      srcURL:URL.createObjectURL(file),
      outBlob:null,
      outURL:null,
      outW:null,
      outH:null,
      levels:null
    });
  });
  renderThumbs();
  updateCounter();
  if(currentIndex<0 && items.length) selectItem(0);
}

function updateCounter(){
  $("counter").textContent = `${items.length} / ${MAX_FILES} 枚`;
}

function renderThumbs(){
  const box=$("thumbs"); box.innerHTML="";
  items.forEach((it,i)=>{
    const d=document.createElement("div");
    d.className="thumb"+(i===currentIndex?" active":"");
    d.innerHTML=`<img src="${it.srcURL}"><div class="name">${escapeHtml(it.file.name)}</div><div class="size">${fmtKB(it.file.size)}</div>`;
    d.onclick=()=>selectItem(i);
    box.appendChild(d);
  });
}

function selectItem(i){
  currentIndex=i;
  const it=items[i];
  $("srcImg").src=it.srcURL;
  $("srcBadge").textContent=`${i+1}/${items.length}`;
  const probe=new Image();
  probe.onload=()=>{
    $("srcStats").innerHTML=`<b>${probe.naturalWidth}×${probe.naturalHeight}</b> / <b>${fmtKB(it.file.size)}</b><br>${escapeHtml(it.file.name)}`;
  };
  probe.src=it.srcURL;

  if(it.outURL){
    $("outImg").src=it.outURL;
    $("outBadge").textContent=it.outBlob.size <= (+$("targetKB").value*1024) ? "目標内" : "最小候補";
    $("outBadge").className="badge "+(it.outBlob.size <= (+$("targetKB").value*1024) ? "ok" : "warn");
    $("outStats").innerHTML=`<b>${it.outW}×${it.outH}</b> / <b>${fmtKB(it.outBlob.size)}</b><br>RGB段階 ${it.levels}`;
  }else{
    $("outImg").removeAttribute("src");
    $("outBadge").textContent="未処理";
    $("outBadge").className="badge";
    $("outStats").textContent="まだ軽量化していない。";
  }
  renderThumbs();
}

$("preset").addEventListener("change",()=>{
  if($("preset").value==="gt3anim"){
    $("maxW").value=200; $("maxH").value=200; $("targetKB").value=20;
  }else if($("preset").value==="gt3bg"){
    $("maxW").value=466; $("maxH").value=466; $("targetKB").value=200;
  }
});

function quantizeImageData(data,rgbLevels,alphaLevels,cleanTransparent){
  const d=data.data;
  const q=v=>rgbLevels>=256?v:Math.round(Math.round(v*(rgbLevels-1)/255)*255/(rgbLevels-1));
  const qa=a=>alphaLevels>=256?a:Math.round(Math.round(a*(alphaLevels-1)/255)*255/(alphaLevels-1));
  for(let i=0;i<d.length;i+=4){
    const a=qa(d[i+3]);
    if(cleanTransparent && a===0){
      d[i]=0; d[i+1]=0; d[i+2]=0; d[i+3]=0; continue;
    }
    d[i]=q(d[i]); d[i+1]=q(d[i+1]); d[i+2]=q(d[i+2]); d[i+3]=a;
  }
  return data;
}

function canvasBlob(canvas){
  return new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
}

async function renderCandidate(bitmap,w,h,levels,alphaLevels,clean){
  const c=$("work"); c.width=w; c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(bitmap,0,0,w,h);
  let data=ctx.getImageData(0,0,w,h);
  data=quantizeImageData(data,levels,alphaLevels,clean);
  ctx.putImageData(data,0,0);
  return await canvasBlob(c);
}

async function optimizeOne(it){
  const bitmap=await createImageBitmap(it.file);
  const maxW=+$("maxW").value, maxH=+$("maxH").value;
  const target=+$("targetKB").value*1024;
  const minLevel=+$("minLevel").value;
  const alphaLevels=+$("alphaLevels").value;
  const clean=$("cleanTransparent").checked;
  const allowShrink=$("allowShrink").checked;

  let scale=Math.min(1,maxW/bitmap.width,maxH/bitmap.height);
  let w=Math.max(1,Math.round(bitmap.width*scale));
  let h=Math.max(1,Math.round(bitmap.height*scale));

  const levelPlan=[8,7,6,5,4,3,2].filter(v=>v>=minLevel);
  let best=null;

  for(let round=0;round<(allowShrink?18:1);round++){
    for(const levels of levelPlan){
      const blob=await renderCandidate(bitmap,w,h,levels,alphaLevels,clean);
      if(!best || blob.size<best.blob.size) best={blob,w,h,levels};
      if(blob.size<=target){
        best={blob,w,h,levels};
        round=999;
        break;
      }
    }
    if(best && best.blob.size<=target) break;
    if(!allowShrink) break;
    w=Math.max(32,Math.round(w*0.94));
    h=Math.max(32,Math.round(h*0.94));
    if(w<=32 || h<=32) break;
  }
  bitmap.close?.();
  return best;
}

$("opt").addEventListener("click",async()=>{
  if(!items.length) return;
  $("opt").disabled=true;
  $("prog").style.display="block";
  $("bar").style.width="0%";

  for(let i=0;i<items.length;i++){
    const res=await optimizeOne(items[i]);
    if(items[i].outURL) URL.revokeObjectURL(items[i].outURL);
    items[i].outBlob=res.blob;
    items[i].outURL=URL.createObjectURL(res.blob);
    items[i].outW=res.w;
    items[i].outH=res.h;
    items[i].levels=res.levels;
    $("bar").style.width=((i+1)/items.length*100)+"%";
    if(i===currentIndex) selectItem(i);
  }

  renderResults();
  $("downloadAll").disabled=false;
  $("opt").disabled=false;
  setTimeout(()=>$("prog").style.display="none",500);
});

function renderResults(){
  const tbody=$("resultBody");
  tbody.innerHTML="";
  items.forEach((it,i)=>{
    const tr=document.createElement("tr");
    const target=+$("targetKB").value*1024;
    const status=it.outBlob ? (it.outBlob.size<=target?"ok":"warn") : "";
    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${escapeHtml(it.file.name)}</td>
      <td>${fmtKB(it.file.size)}</td>
      <td class="${status}">${it.outBlob?fmtKB(it.outBlob.size):"-"}</td>
      <td>${it.outBlob?`${it.outW}×${it.outH}`:"-"}</td>
      <td>${it.outBlob?`<button class="smallBtn" data-i="${i}">保存</button>`:""}</td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll("button[data-i]").forEach(btn=>{
    btn.onclick=()=>downloadItem(+btn.dataset.i);
  });
}

function downloadItem(i){
  const it=items[i];
  if(!it.outBlob) return;
  const a=document.createElement("a");
  a.href=it.outURL;
  const stem=it.file.name.replace(/\.[^.]+$/,"");
  a.download=stem+"_GT3_optimized.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$("downloadAll").addEventListener("click",async()=>{
  const processed=items.filter(x=>x.outBlob);
  for(let i=0;i<processed.length;i++){
    const it=processed[i];
    const a=document.createElement("a");
    a.href=it.outURL;
    const stem=it.file.name.replace(/\.[^.]+$/,"");
    a.download=stem+"_GT3_optimized.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise(r=>setTimeout(r,140));
  }
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
