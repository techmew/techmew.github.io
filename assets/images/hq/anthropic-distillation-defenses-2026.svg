<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AnthropicがClaudeの蒸留対策を強化</title><desc id="desc">ひまねこラボ。API利用者が確認すべき変更点と開発者の対応を整理。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132d35"/><stop offset="1" stop-color="#174b50"/></linearGradient><linearGradient id="line"><stop stop-color="#6de2c5"/><stop offset="1" stop-color="#86baff"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".16" stroke="#bceee3"><path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><circle cx="1280" cy="420" r="190" fill="none" stroke="url(#line)" stroke-width="10"/><circle cx="1280" cy="420" r="130" fill="none" stroke="#d5fff1" stroke-width="3" stroke-dasharray="13 16"/><path d="M1185 425l65 66 128-151" fill="none" stroke="#baf6e2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="130" fill="#9cebd2" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="3">ひまねこラボ  /  AI SECURITY</text><text x="110" y="320" fill="#fff" font-family="sans-serif" font-size="65" font-weight="800">Claudeの蒸留対策を強化</text><text x="110" y="410" fill="#fff" font-family="sans-serif" font-size="57" font-weight="800">API利用者が確認すること</text><text x="114" y="510" fill="#d2ebe5" font-family="sans-serif" font-size="33">「蒸留」とは？連携の互換性・誤検知・料金の注意</text><rect x="110" y="586" width="490" height="4" rx="2" fill="#62daba"/><text x="110" y="670" fill="#b7d9d2" font-family="sans-serif" font-size="27">公式発表：2026年10月12日</text></svg>