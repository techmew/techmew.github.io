<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11162c">
<title>NEKO SIGNAL | 夢境サルベージ</title>
<style>
:root{--ink:#f6f7ff;--gold:#ffe6a7;--glass:#10152bcf}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1026;color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 35%,#26385a,#090d1d)}
canvas{width:min(100vw,177.7778vh);max-height:100vh;aspect-ratio:16/9;display:block;box-shadow:0 0 70px #05091b;image-rendering:auto}
#hud{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);width:min(960px,100%);padding:10px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;text-shadow:0 2px 5px #000b;pointer-events:none;font-weight:800;font-size:clamp(11px,1.8vw,16px)}
#hud .left{display:flex;align-items:center;gap:10px}#bar{width:clamp(85px,16vw,180px);height:13px;border-radius:12px;background:#2e294a;overflow:hidden;border:1px solid #ffffff75}#hpbar{height:100%;background:linear-gradient(90deg,#fa6a93,#ffbc7e);transition:width .16s}
#topbtn{pointer-events:auto;border:1px solid #ffffff70;background:#151c3aaf;color:white;padding:8px 10px;border-radius:12px;cursor:pointer}
#message{position:absolute;left:50%;top:14%;transform:translateX(-50%);max-width:min(680px,90vw);text-align:center;background:#111b3bba;border:1px solid #f7edff65;border-radius:14px;padding:8px 16px;line-height:1.5;font-size:clamp(12px,1.6vw,17px);text-shadow:0 2px 2px #111;pointer-events:none;opacity:0;transition:opacity .3s}
#screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0c1238bd;backdrop-filter:blur(8px);padding:16px;overflow:auto}
#screen.show{display:flex}#panel{width:min(560px,96vw);max-height:95vh;overflow:auto;border:1px solid #ffffff77;border-radius:22px;padding:clamp(15px,3vw,30px);background:linear-gradient(145deg,#26375ff2,#171933f7);text-align:center;box-shadow:0 18px 70px #0009}
h1{margin:.2em 0;font-size:clamp(30px,6vw,52px);letter-spacing:.07em;color:#ffe5b6;text-shadow:0 4px #6c578d}
h2{font-size:clamp(24px,4vw,36px);margin:.4em 0;color:#ffe5b6}
p{line-height:1.7}small{opacity:.85}button{font:inherit}
.big{background:linear-gradient(120deg,#f4ab86,#f9dfa0);color:#292037;font-weight:900;border:0;border-radius:24px;padding:13px 26px;cursor:pointer;min-height:49px;box-shadow:0 5px 0 #a87375;margin:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a87375}
#cards{display:grid;gap:9px;margin:15px 0}#cards button{background:#38476be6;color:white;border:1px solid #ffdbb6a0;padding:12px;text-align:left;border-radius:12px;cursor:pointer}
#cards button strong{color:#ffe3af}
#controls{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:none;align-items:end;justify-content:space-between;padding:0 min(4vw,25px);pointer-events:none}
.cluster{display:flex;gap:9px;align-items:end}
.ctrl{pointer-events:auto;width:clamp(53px,11vw,79px);height:clamp(53px,11vw,79px);border:2px solid #fff8;border-radius:40%;background:#19284da8;color:white;font-size:clamp(11px,2.5vw,21px);font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 4px 12px #fff2}
.ctrl:active,.ctrl.pressed{background:#e5ae86cc;color:#261d39;transform:scale(.94)}
#status{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.75;pointer-events:none}
@media(pointer:coarse),(max-width:800px){#controls{display:flex}#status{display:none}#hud{padding:7px 10px}#panel{padding:15px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540" aria-label="横スクロール猫アクションゲーム"></canvas></div>
<div id="hud"><div class="left"><span id="act">夢境 1/3</span><div id="bar"><div id="hpbar"></div></div><span id="hptext"></span></div><span id="info">欠片 0/3 ・ 星 0</span><button id="topbtn" aria-label="一時停止">Ⅱ</button></div>
<div id="message" role="status"></div>
<div id="controls" aria-label="タッチ操作">
<div class="cluster"><button class="ctrl" data-key="left" aria-label="左へ">◀</button><button class="ctrl" data-key="right" aria-label="右へ">▶</button></div>
<div class="cluster"><button class="ctrl" data-key="dash">回避</button><button class="ctrl" data-key="jump">ジャンプ</button><button class="ctrl" data-key="attack">攻撃</button></div>
</div>
<div id="status">移動 A/D・←→ ／ ジャンプ Space・W ／ 攻撃 J・クリック ／ 回避 K・Shift ／ ポーズ P</div>
<div id="screen" class="show"><div id="panel"><h1>NEKO SIGNAL</h1><p>夢境サルベージ<br>星が消えた夜、ちいさな猫は誰かの夢に潜る。</p><p>3つの夢を渡り、失われた「おやすみ」の声を取り戻そう。<br>道は毎回変わる。敵を倒して、最後まで生き延びろ。</p><button class="big" id="start">冒険をはじめる</button><p><small>PC: ←→ 移動 / Space ジャンプ / J 攻撃 / K 回避<br>スマホ: 画面下のボタンで操作。音声は開始後に有効になります。</small></p></div></div>
<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false}),scr=document.getElementById("screen"),panel=document.getElementById("panel"),msg=document.getElementById("message");
const hud={act:document.getElementById("act"),hpbar:document.getElementById("hpbar"),hptext:document.getElementById("hptext"),info:document.getElementById("info")};
const W=960,H=540,G=452,WORLD=3500,PI=Math.PI;
const keys={left:false,right:false,jump:false,attack:false,dash:false};
let mode="title",stage=0,cam=0,player=null,platforms=[],enemies=[],orbs=[],shots=[],puffs=[],boss=null,portal=false,frame=0,score=0,shards=0,seed=1,shake=0,stopped=false,runTime=0;
let audio=null,songTick=0,muted=false,lastNote=-1,noticeUntil=0,noticeText="",upgrade=0;
const STAGES=[
{title:"ねむりの草原",sky:["#22476d","#a1c7c5"],floor:"#4e9e83",far:"#4b7796",near:"#376a8d",boss:"夢喰いモコ",memory:"だれかが毎晩、星を数えてくれた。"},
{title:"あめふり時計塔",sky:["#242f69","#b08bba"],floor:"#827cbe",far:"#555593",near:"#393b79",boss:"逆さの時守",memory:"その声が途切れた日、街の時計も止まった。"},
{title:"ほしの眠る海",sky:["#111b54","#665ea8"],floor:"#4c83a2",far:"#2b4688",near:"#202e65",boss:"夜明けを拒むクジラ",memory:"まだ間に合う。失った言葉は、消えていない。"}
];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rand(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296}
function choice(xs){return xs[(rand()*xs.length)|0]}
function safeLoad(){try{return JSON.parse(localStorage.getItem("neko-signal-save")||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem("neko-signal-save",JSON.stringify({best:Math.max(safeLoad().best||0,score),completed:mode==="win"||!!safeLoad().completed,version:1}))}catch(e){}}
const data=safeLoad();
let best=data.best||0;
function note(freq,dur=.14,vol=.04,type="sine",when=0){if(!audio||muted)return;try{const t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,vol),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sound(name){if(name==="jump"){note(440,.12,.045,"triangle");note(660,.13,.025,"sine",.06)}
else if(name==="attack"){note(205,.085,.09,"sawtooth");note(95,.1,.035,"triangle",.04)}
else if(name==="hurt"){note(148,.24,.095,"sawtooth");note(80,.15,.035,"square",.07)}
else if(name==="dash"){note(360,.075,.07,"triangle");note(550,.08,.03,"sine",.05)}
else if(name==="pickup"){note(850,.08,.07);note(1100,.13,.05,"triangle",.08)}
else if(name==="boss"){note(110,.3,.12,"sawtooth");note(140,.35,.08,"triangle",.13)}
else if(name==="clear"){[660,830,990,1320].forEach((f,i)=>note(f,.32,.07,"triangle",i*.13))}
}
function startAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(e){}}
const scale=[0,2,3,5,7,10,12,15],bass=[110,110,146.83,130.81];
function music(){if(!audio||muted||mode!=="play")return;const beat=Math.floor(frame/18);if(beat===lastNote)return;lastNote=beat;const n=scale[(beat*3+stage*2)%scale.length],root=stage===2?196:stage===1?174.61:220;note(root*Math.pow(2,n/12),.2,.016,"triangle");if(beat%4===0)note(bass[(beat/4+stage)%4],.31,.036,"sine");if(beat%2===0)note(7200,.025,.004,"triangle")}
function showMessage(text,dur=180){noticeText=text;noticeUntil=frame+dur;msg.textContent=text;msg.style.opacity=1}
function drawPanel(title,body,buttons){scr.classList.add("show");panel.innerHTML="<h2>"+title+"</h2><p>"+body+"</p>";for(const btn of buttons){const b=document.createElement("button");b.className="big";b.textContent=btn.label;b.addEventListener("click",btn.run);panel.appendChild(b)}}
function hidePanel(){scr.classList.remove("show")}
function begin(){startAudio();best=safeLoad().best||best;score=0;shards=0;upgrade=0;stage=0;player={x:70,y:G-42,w:32,h:36,vx:0,vy:0,hp:6,maxHP:6,jumps:0,face:1,ifr:0,atk:0,cool:0,dash:0,dashCD:0,weapon:0,power:1,speed:1,heal:0};loadStage();mode="play";hidePanel();showMessage("「ねえ、星を返して。」旅がはじまる。",220)}
function loadStage(){seed=(((Date.now()%2147483647)+stage*10293847)^(score*137))|0;cam=0;portal=false;platforms=[];enemies=[];orbs=[];shots=[];puffs=[];boss=null;
for(let i=0;i<26;i++){const x=185+i*113+(rand()-.5)*33,y=300+rand()*92;platforms.push({x,y,w:75+rand()*72})}
for(let i=0;i<19+stage*4;i++){const x=330+i*(116-stage*8)+rand()*45;if(x>2840)continue;const type=choice(["puff","puff","fly","turtle"]);enemies.push({x,y:type==="fly"?260+rand()*100:G-26,w:29,h:25,type,hp:type==="turtle"?5:3,max:3,vx:0,phase:rand()*6,hit:0,alive:true,base:0})}
boss={x:3030,y:G-103,w:110,h:100,hp:26+stage*14,max:26+stage*14,phase:0,attack:160,hit:0,active:false,dead:false};
player.x=90;player.y=G-player.h;player.vx=0;player.vy=0;player.jumps=0;player.hp=Math.min(player.maxHP,player.hp+2);
showMessage("第"+(stage+1)+"夜　"+STAGES[stage].title,200)}
function canJump(){return player.jumps<2}
function jump(){if(mode!=="play"||!canJump())return;player.vy=player.jumps===0?-11.8:-10.2;player.jumps++;sound("jump");for(let i=0;i<9;i++)particle(player.x+16,player.y+38,"#dff8ff",2)}
function attack(){if(mode!=="play"||player.cool>0)return;player.atk=16;player.cool=player.weapon===2?42:player.weapon===1?28:20;sound("attack");const reach=player.weapon===2?100:player.weapon===1?230:87,py=player.y+17;
if(player.weapon===1){shots.push({x:player.x+16,y:py,vx:player.face*11,vy:0,life:30,r:9,enemy:false,dmg:2*player.power,color:"#b6ffe7"});return}
for(const e of enemies){if(!e.alive||e.hit>0)continue;const dx=e.x+e.w/2-(player.x+16),dy=e.y+e.h/2-py;if(dx*player.face>-15&&dx*player.face<reach&&Math.abs(dy)<(player.weapon===2?110:56))hitEnemy(e,player.weapon===2?4*player.power:2*player.power)}
if(boss.active&&!boss.dead){const dx=boss.x+boss.w/2-(player.x+16);if(dx*player.face>-5&&dx*player.face<reach+20&&Math.abs(boss.y+48-py)<100)hitBoss(player.weapon===2?3*player.power:2*player.power)}}
function dash(){if(mode!=="play"||player.dashCD>0)return;player.dash=12;player.dashCD=75;player.vx=player.face*17;player.ifr=Math.max(player.ifr,18);sound("dash");shake=4}
function hitEnemy(e,dmg){e.hp-=dmg;e.hit=10;for(let i=0;i<9;i++)particle(e.x+10,e.y+10,"#ffe39e",3);if(e.hp<=0){e.alive=false;score+=20;orbs.push({x:e.x,y:e.y,r:9,kind:"star"});if(rand()<.11)orbs.push({x:e.x+20,y:e.y-10,r:10,kind:"heart"})}}
function hitBoss(dmg){boss.hp-=dmg;boss.hit=8;shake=7;for(let i=0;i<14;i++)particle(boss.x+rand()*boss.w,boss.y+rand()*boss.h,"#ffb7c9",4);if(boss.hp<=0){boss.dead=true;portal=true;score+=600;sound("clear");showMessage("夢喰いが光に戻った。右端の扉へ進もう。",230);for(let i=0;i<70;i++)particle(boss.x+rand()*130,boss.y+rand()*100,choice(["#ffeab5","#a8f4ff","#fabfd9"]),6)}}
function hurt(n=1){if(player.ifr>0||mode!=="play")return;player.hp-=n;player.ifr=78;player.vy=-7;player.vx=-player.face*6;shake=12;sound("hurt");if(player.hp<=0)die()}
function die(){mode="dead";save();drawPanel("夢から覚めた……","拾い集めた星："+score+"<br>最高記録："+Math.max(score,best)+"<br>「もう一度なら、きっと。」",[{label:"はじめから挑戦",run:begin}]);best=Math.max(score,best)}
function stageClear(){shards++;score+=300;showMessage(STAGES[stage].memory,170);sound("clear");if(stage===2){win();return}mode="choose";
const choices=[
{label:"⚔ 星剣をみがく — 攻撃力アップ",f:()=>{player.power+=.5}},
{label:"❤ 月のミルク — 最大HP +2・全回復",f:()=>{player.maxHP+=2;player.hp=player.maxHP}},
{label:"✦ ねこ杖 — 遠距離攻撃に切り替える",f:()=>{player.weapon=1}},
{label:"☄ 夢ハンマー — 範囲攻撃に切り替える",f:()=>{player.weapon=2}},
{label:"🐾 風のしっぽ — 移動速度アップ",f:()=>{player.speed+=.14}},
];
const pool=choices.sort(()=>rand()-.5).slice(0,3);
drawPanel("星の欠片を手に入れた",""+STAGES[stage].memory+"<br>次の夜に持ち込む力をひとつ選ぼう。",[]);
for(const a of pool){const b=document.createElement("button");b.className="big";b.style.fontSize="14px";b.textContent=a.label;b.addEventListener("click",()=>{a.f();stage++;loadStage();mode="play";hidePanel()});panel.appendChild(b)}save()}
function win(){mode="win";score+=1000;save();best=Math.max(best,score);drawPanel("夜明けのエンディング","猫は最後の星を空へ返した。<br><br>聞こえてきたのは、忘れていたやさしい声。<br>「おかえり。今日も、いい夢を。」<br><br>夢の世界に朝が来た。<br><strong>THE END — 3つの夢を救った！</strong><br>スコア："+score+" ／ 最高："+best,[{label:"別の夢にもう一度",run:begin}])}
function particle(x,y,color,size=3){if(puffs.length>380)return;puffs.push({x,y,vx:(rand()-.5)*6,vy:(rand()-.5)*6-1,life:25+rand()*28,max:45,color,size})}
function useKey(k,down){const key=k.toLowerCase(),maps={arrowleft:"left",a:"left",arrowright:"right",d:"right",arrowup:"jump",w:"jump"," ":"jump",j:"attack",z:"attack",k:"dash",shift:"dash",x:"dash"};if(key==="p"||key==="escape"){if(down){if(mode==="play")pause();else if(mode==="pause")unpause()}return}const action=maps[key];if(!action)return;if(down&&!keys[action]){if(action==="jump")jump();if(action==="attack")attack();if(action==="dash")dash()}keys[action]=down}
window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();useKey(e.key,true)},{passive:false});
window.addEventListener("keyup",e=>useKey(e.key,false));
window.addEventListener("blur",()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(mode==="play")pause()});
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&mode==="play")attack()});
document.querySelectorAll(".ctrl").forEach(el=>{const k=el.dataset.key;const press=e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);if(!keys[k]){if(k==="jump")jump();if(k==="attack")attack();if(k==="dash")dash()}keys[k]=true;el.classList.add("pressed")};const release=e=>{e.preventDefault();keys[k]=false;el.classList.remove("pressed")};el.addEventListener("pointerdown",press);el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);el.addEventListener("lostpointercapture",release)});
function pause(){mode="pause";drawPanel("一時停止","星の旅は、ここで待っている。",[{label:"再開する",run:unpause},{label:"最初からやり直す",run:begin}])}
function unpause(){mode="play";hidePanel();lastNote=-1}
document.getElementById("topbtn").addEventListener("click",()=>{if(mode==="play")pause();else if(mode==="pause")unpause()});
document.getElementById("start").addEventListener("click",begin);
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,PI*2);ctx.fillStyle=color;ctx.fill()}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,color);g.addColorStop(1,"transparent");circle(x,y,r,g)}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0],points[1]);for(let i=2;i<points.length;i+=2)ctx.lineTo(points[i],points[i+1]);ctx.closePath();ctx.fill()}
function drawBackground(){const style=STAGES[stage],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,style.sky[0]);g.addColorStop(1,style.sky[1]);rect(0,0,W,H,g);
for(let i=0;i<56;i++){const x=((i*163+45-cam*.08)%(W+100)+W+100)%(W+100)-30,y=37+((i*83)%245),r=1.2+(i%3);glow(x,y,7,"#ddedff5a");circle(x,y,r,"#f2f0ef")}
for(let layer=0;layer<3;layer++){const col=layer===0?style.far:layer===1?style.near:style.floor;
const offset=cam*(.13+layer*.15),step=195-layer*25,yBase=365+layer*52;
for(let i=-2;i<10;i++){const x=i*step-(offset%step);polygon([x-110,H,x+step*.52,yBase-70-(i%3)*20,x+step+80,H],col)}}
glow(740-cam*.035,95,180,stage===2?"#ffe4d933":"#ffeeac40");circle(740-cam*.035,95,stage===2?32:43,"#ffebc7");
ctx.save();ctx.translate(-cam,0);
rect(0,G,WORLD,H-G,style.floor);rect(0,G,WORLD,10,"#d9eebc");
for(let i=0;i<115;i++){const x=i*31+((i*43)%27),y=G+20+(i%4)*12;circle(x,y,2+i%3,i%3===0?"#d8eebb":"#83bd9f")}
for(const p of platforms){rect(p.x,p.y,p.w,15,"#4d6182");rect(p.x,p.y,p.w,5,"#f6d5b5");for(let i=0;i<3;i++)circle(p.x+12+i*28,p.y+2,3,"#d9e4c9")}
for(let i=0;i<43;i++){const x=i*83+19;if(x>WORLD)continue;ctx.strokeStyle="#caf0b8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,G);ctx.lineTo(x-2,G-13);ctx.stroke();circle(x-2,G-14,i%4===0?5:3,i%4===0?"#ffd9e6":"#e8f1a0")}
ctx.restore()}
function cat(x,y,w,h,col="#fff2d8",face=1,flash=false){ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(face,1);ctx.translate(-w/2,-h/2);const c=flash?"white":col;
ctx.strokeStyle="#715876";ctx.lineWidth=2;
circle(w*.45,h*.6,w*.36,c);polygon([w*.15,h*.34,w*.2,-h*.1,w*.49,h*.24],c);polygon([w*.51,h*.23,w*.86,-h*.1,w*.84,h*.38],c);
circle(w*.36,h*.48,w*.047,"#293b51");circle(w*.67,h*.48,w*.047,"#293b51");polygon([w*.48,h*.58,w*.56,h*.58,w*.52,h*.65],"#ef92a3");circle(w*.52,h*.7,1.5,"#293b51");circle(w*.17,h*.62,3,"#ffb9bf");circle(w*.81,h*.62,3,"#ffb9bf");
ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.8,h*.82);ctx.quadraticCurveTo(w*1.27,h*.65,w*.96,h*.27);ctx.stroke();
ctx.restore()}
function drawEnemy(e){const x=e.x-cam,y=e.y;if(x<-80||x>W+80)return;ctx.save();ctx.translate(x,y);const color=e.hit>0?"white":e.type==="puff"?"#e0c0eb":e.type==="fly"?"#c4e6f6":"#9ecbbb";
circle(14,15,e.type==="turtle"?20:16,color);polygon([2,12,5,-3,14,7],color);polygon([16,6,27,-4,28,12],color);
if(e.type==="fly"){ctx.fillStyle="#e3fdff";ctx.beginPath();ctx.ellipse(-7,9,12,5,-.4,0,PI*2);ctx.ellipse(34,9,12,5,.4,0,PI*2);ctx.fill()}
circle(8,15,2.3,"#18283d");circle(20,15,2.3,"#18283d");circle(14,23,2,"#a45c7e");ctx.restore()}
function drawBoss(){if(!boss||boss.dead)return;const x=boss.x-cam,y=boss.y,b=STAGES[stage];glow(x+55,y+60,125,"#f5bbdc33");ctx.save();ctx.translate(x,y);const flash=boss.hit>0?"white":stage===0?"#e3d1f5":stage===1?"#bfc3f9":"#b7e0ec";
ctx.fillStyle=flash;ctx.beginPath();ctx.ellipse(55,60,58+Math.sin(frame*.04)*3,47,0,0,PI*2);ctx.fill();
polygon([4,41,13,-2,45,25],flash);polygon([70,25,105,-5,110,45],flash);
circle(37,54,7,"#29334b");circle(77,54,7,"#29334b");circle(55,73,5,"#ec9eac");ctx.restore();
rect(x,y-25,110,10,"#292a54");rect(x,y-25,110*clamp(boss.hp/boss.max,0,1),10,"#f6a0bf");
ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 15px system-ui";ctx.fillText(b.boss,x+55,y-34)}
function drawPlayer(){if(!player)return;const x=player.x-cam,y=player.y;glow(x+17,y+19,31,"#fff5da49");ctx.globalAlpha=player.ifr>0&&frame%8<4?.55:1;cat(x,y,35,37,stage===2?"#ffecd9":"#fff0d7",player.face);ctx.globalAlpha=1;
ctx.save();ctx.translate(x+16,y+22);ctx.scale(player.face,1);
if(player.atk>0){ctx.rotate(Math.sin((16-player.atk)/16*PI)*.65);ctx.strokeStyle=player.weapon===2?"#ffd79f":player.weapon===1?"#9cffe4":"#fbf9ff";ctx.lineWidth=player.weapon===2?13:6;ctx.beginPath();ctx.arc(0,0,player.weapon===2?69:55,-1.05,.68);ctx.stroke()}
ctx.restore();if(player.dash>0)glow(x+18,y+20,47,"#d6f8ffaa")}
function update(){if(mode!=="play")return;frame++;runTime++;music();if(noticeUntil<frame)msg.style.opacity=0;
const p=player;const oldY=p.y;const accel=.82*p.speed,maxSpeed=5.1*p.speed;
if(p.dash>0){p.dash--;p.vx=p.face*16}
else{if(keys.left){p.vx-=accel;p.face=-1}if(keys.right){p.vx+=accel;p.face=1}if(!keys.left&&!keys.right)p.vx*=.78;p.vx=clamp(p.vx,-maxSpeed,maxSpeed)}
p.x=clamp(p.x+p.vx,0,WORLD-p.w);p.vy=clamp(p.vy+.58,-17,13);p.y+=p.vy;
if(oldY+p.h<=G+15&&p.y+p.h>=G&&p.vy>=0){p.y=G-p.h;p.vy=0;p.jumps=0}
for(const pl of platforms){if(p.vy>=0&&oldY+p.h<=pl.y+8&&p.y+p.h>=pl.y&&p.x+p.w>pl.x&&p.x<pl.x+pl.w){p.y=pl.y-p.h;p.vy=0;p.jumps=0}}
if(p.y>H+40)hurt(4);if(p.atk>0)p.atk--;if(p.cool>0)p.cool--;if(p.ifr>0)p.ifr--;if(p.dashCD>0)p.dashCD--;
if(keys.attack&&p.cool===0)attack();if(keys.dash&&p.dashCD===0)dash();
for(const e of enemies){if(!e.alive)continue;e.phase+=.04;e.hit=Math.max(0,e.hit-1);if(e.type==="fly"){e.x+=Math.sin(e.phase)*.9;e.y+=Math.sin(e.phase*1.6)*.8}else{const dx=p.x-e.x;if(Math.abs(dx)<340)e.x+=Math.sign(dx)*(e.type==="turtle"?.6:1.25);e.y=G-e.h}
if(Math.abs(p.x-e.x)<p.w*.6+e.w*.5&&Math.abs(p.y-e.y)<p.h*.6+e.h*.5)hurt();
}
if(!boss.active&&p.x>2670)boss.active=true;
if(boss.active&&!boss.dead){boss.phase+=.04;boss.hit=Math.max(0,boss.hit-1);boss.y=G-boss.h+Math.sin(boss.phase)*12;
if(Math.abs(p.x-boss.x)<80&&Math.abs(p.y-boss.y)<95)hurt(2);
boss.attack--;if(boss.attack<=0){boss.attack=Math.max(65,126-stage*17-(boss.hp<boss.max/2?25:0));sound("boss");
const count=boss.hp<boss.max*.5?5:3;for(let i=0;i<count;i++){const theta=PI-(i-(count-1)/2)*.22;shots.push({x:boss.x+30,y:boss.y+50,vx:-Math.abs(Math.cos(theta))*4.6-(stage*.3),vy:(i-(count-1)/2)*1.35,life:210,r:8,enemy:true,color:"#ffbfd1"})}}}
for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.life--;if(!s.enemy){for(const e of enemies){if(!e.alive||e.hit>0)continue;if(Math.abs(s.x-e.x-13)<25&&Math.abs(s.y-e.y-12)<24){hitEnemy(e,s.dmg);s.life=0;break}}if(boss.active&&!boss.dead&&Math.abs(s.x-boss.x-50)<65&&Math.abs(s.y-boss.y-45)<60){hitBoss(s.dmg);s.life=0}}
else if(Math.abs(s.x-p.x-16)<18+s.r&&Math.abs(s.y-p.y-16)<19+s.r){hurt();s.life=0}}
shots=shots.filter(s=>s.life>0&&s.y<560&&s.y>-50);
for(const o of orbs){o.y+=Math.sin(frame*.09+o.x)*.25;if(Math.abs(o.x-p.x-16)<27&&Math.abs(o.y-p.y-16)<32){if(o.kind==="star"){score+=50;sound("pickup")}else{p.hp=Math.min(p.maxHP,p.hp+1);sound("pickup")}o.taken=true}}
orbs=orbs.filter(o=>!o.taken);
for(const fx of puffs){fx.x+=fx.vx;fx.y+=fx.vy;fx.vy+=.08;fx.life--}puffs=puffs.filter(f=>f.life>0);
if(portal&&p.x>WORLD-190){stageClear();return}
cam+=((clamp(p.x-290,0,WORLD-W))-cam)*.11;shake*=.82;
hud.act.textContent="夢境 "+(stage+1)+"/3";hud.hpbar.style.width=(p.hp/p.maxHP*100)+"%";hud.hptext.textContent=p.hp+"/"+p.maxHP;
hud.info.textContent="欠片 "+shards+"/3 ・ 星 "+score+" ・ "+["星剣","ねこ杖","夢ハンマー"][p.weapon]}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
drawBackground();
ctx.save();ctx.translate(-cam,0);
for(let i=0;i<orbs.length;i++){const o=orbs[i];glow(o.x,o.y,23,o.kind==="heart"?"#ff94a477":"#fff8aa77");circle(o.x,o.y,o.r,o.kind==="heart"?"#fd8d9a":"#fdf1b0")}
for(const fx of puffs){ctx.globalAlpha=clamp(fx.life/fx.max,0,1);circle(fx.x,fx.y,fx.size,fx.color)}ctx.globalAlpha=1;
for(const s of shots){glow(s.x,s.y,s.r*2,s.color+"77");circle(s.x,s.y,s.r,s.color)}
ctx.restore();
for(const e of enemies)if(e.alive)drawEnemy(e);
if(boss?.active&&!boss.dead)drawBoss();
if(portal){const x=WORLD-137-cam;glow(x,353,95,"#fff0c988");ctx.strokeStyle="#ffe8bf";ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(x,353,38,68,0,0,PI*2);ctx.stroke();ctx.font="bold 17px system-ui";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText("次の夢へ →",x,262)}
drawPlayer();
if(boss?.active&&!boss.dead){ctx.fillStyle="#f6e7ff";ctx.font="bold 15px system-ui";ctx.textAlign="center";ctx.fillText("BOSS",W/2,28)}
ctx.restore()}
function loop(){if(!stopped){update();draw()}requestAnimationFrame(loop)}
showMessage("星を取り戻す旅へようこそ",200);loop();
})();
</script>
