function pinchDist(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0}
function orbit(dx,dy){yaw-=dx*.007;pitch=clamp(pitch+dy*.006,-1.36,1.36)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){prevPinch=pinchDist();active=null;return}if(pointers.size>2){active=null;return}let zone=game.petMode?pick(e.clientX,e.clientY):null;active={id:e.pointerId,x:e.clientX,y:e.clientY,at:performance.now(),zone,dist:0,touched:0};});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const before=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const dx=e.clientX-before.x,dy=e.clientY-before.y;if(pointers.size>=2){const p=pinchDist();if(prevPinch&&p)distance=clamp(distance*prevPinch/p,1.45,8);prevPinch=p;return}
if(!active||active.id!==e.pointerId)return;const delta=Math.hypot(dx,dy),now=performance.now();active.dist+=delta;
if(!game.petMode||!active.zone){orbit(dx,dy);return}
const current=pick(e.clientX,e.clientY)||active.zone;if(current&&delta>1.2&&now-active.touched>65){touchCat(current,e.clientX,e.clientY,delta,Math.max(8,now-active.at)/Math.max(1,Math.min(10,active.dist/.9)),false);active.touched=now}active.zone=current;
});
function endPointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(active&&active.id===e.pointerId&&game.petMode&&active.zone&&active.dist<14){touchCat(active.zone,e.clientX,e.clientY,0,1,true)}active=null;prevPinch=pinchDist()}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=clamp(distance*Math.exp(e.deltaY*.0012),1.45,8)},{passive:false});
function setPetMode(b){game.petMode=b;$('petBtn').setAttribute('aria-pressed',b);$('orbitBtn').setAttribute('aria-pressed',!b);canvas.classList.toggle('pet',b);$('help').textContent=b?'なでる：白猫をゆっくりスワイプ / 2本指で拡大縮小':'ドラッグで360°回転 / 2本指で拡大縮小'}
$('petBtn').addEventListener('click',()=>setPetMode(true));$('orbitBtn').addEventListener('click',()=>setPetMode(false));
$('resetView').addEventListener('click',()=>{yaw=.37;pitch=.16;distance=4.65;game.roll=false;$('bellyBtn').innerHTML='おなか<br>ごろん'});
$('bellyBtn').addEventListener('click',()=>{game.roll=!game.roll;$('bellyBtn').innerHTML=game.roll?'元に<br>戻す':'おなか<br>ごろん';if(game.roll){yaw=.1;pitch=.68;distance=4.3;say('ころん。おなかを見せてくれた。',true)}else{yaw=.37;pitch=.16;say('むくっと起き上がった。',true)}});
$('resetBtn').addEventListener('click',()=>{game.stress=0;game.mood=Math.max(40,game.mood);game.lastTap=[];game.biteTo=0;say('少し休憩。ゆっくり近づこう。',true);updateHud()});
$('soundBtn').addEventListener('click',()=>{game.sound=!game.sound;$('soundBtn').setAttribute('aria-pressed',game.sound);$('soundBtn').textContent=game.sound?'音 ON':'音 OFF';if(game.sound)beep('meow')});
let last=performance.now();const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const t=clock.getElapsedTime();
 if(!pointers.size){game.stress=clamp(game.stress-dt*2.7,0,100);if(game.stress<18&&game.mood<54)game.mood+=dt*.9}
 game.express=clamp(game.express-dt*.23,0,1);game.bite=Math.max(0,game.bite-dt*1.8);
 const grumpy=game.stress>65,biting=now<game.biteTo;
 let rollTarget=game.roll?-1.65:0;bodyRig.rotation.z=THREE.MathUtils.damp(bodyRig.rotation.z,rollTarget,3.7,dt);
 bodyRig.position.y=THREE.MathUtils.damp(bodyRig.position.y,game.roll?1.12:.9,3.7,dt);
 torso.scale.y=.55*(1+Math.sin(t*2)*.022);
 head.rotation.x=THREE.MathUtils.damp(head.rotation.x,biting?-.30:game.express?-.055*game.express:.01,5,dt);
 head.rotation.y=THREE.MathUtils.damp(head.rotation.y,(biting?-.11:Math.sin(t*.47)*.035)+game.express*.075,3,dt);
 head.position.y=1.40+Math.sin(t*1.5)*.008;
 const slowBlink=Math.sin(t*1.45)>.994?1:0;let eyeNarrow=biting?.58:grumpy?.48:game.express>.3?.42:.24;let closure=slowBlink?1:eyeNarrow;
 for(const o of eyes){o.eg.scale.y=THREE.MathUtils.damp(o.eg.scale.y,1-closure*.83,7,dt);o.lid.position.y=.104-(closure*.08);o.lid.scale.y=.012*(1+closure*4)}
 for(let i=0;i<ears.length;i++){ears[i].rotation.z=THREE.MathUtils.damp(ears[i].rotation.z,(i===0?.16:-.16)+Math.sin(t*1.7+i*2)*(grumpy?.12:.028)+(biting?i===0?.32:-.3:0),5,dt)}
 for(let i=0;i<tailBones.length;i++){tailBones[i].rotation.y=Math.sin(t*1.3+i*.46)*(grumpy?.24:.09)*(i/10+.3);tailBones[i].rotation.x=.05+Math.sin(t*.68+i*.27)*.025}
 biteMouth.scale.y=.015+(biting?.23*Math.abs(Math.sin(t*23)):.005);tongue.position.y=-.33-(biting?.08*Math.abs(Math.sin(t*23)):0);
 const dpr=Math.min(devicePixelRatio||1,1.7);if(canvas.width!==Math.floor(innerWidth*dpr)||canvas.height!==Math.floor(innerHeight*dpr)){renderer.setPixelRatio(dpr);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
 placeCamera();renderer.render(scene,camera);if(Math.floor(t*3)%2===0)updateHud()
}
setTimeout(()=>$('loading').classList.add('done'),350);say('頭・あご・おなかは大好き。ゆっくりなでてね。',true);tick();
</script>
